name: CI - Build and Test

on:
  push:
    branches: [ dev, main, 'release/**' ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build-and-test:
    name: Build and Test Backend
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: admin1
          MYSQL_DATABASE: techmate_inventory_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -padmin1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: 🔍 Verify MySQL connection
      run: |
        sudo apt-get install -y mysql-client
        mysql --host 127.0.0.1 --port 3306 -uroot -padmin1 -e "SHOW DATABASES"

    - name: 🧪 Run tests
      env:
        SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/techmate_inventory_test
        SPRING_DATASOURCE_USERNAME: root
        SPRING_DATASOURCE_PASSWORD: admin1
        JWT_SECRET: test-secret-key-for-ci-pipeline-do-not-use-in-production
        SWAGGER_ENABLED: false
      run: ./mvnw clean test -B

    - name: 🏗️ Build JAR
      run: ./mvnw clean package -DskipTests -B

    - name: 📊 Test Report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Maven Tests
        path: target/surefire-reports/*.xml
        reporter: java-junit
        fail-on-error: true

    - name: 📦 Upload JAR artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: techmate-backend-jar
        path: target/*.jar
        retention-days: 5

    - name: ✅ Build Summary
      if: always()
      run: |
        echo "### 🎯 Build Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Java Version:** 17" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
