spring.application.name=techmate_inventory

server.url=http://localhost:8080

server.port=8080

  
  

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/techmate_inventory}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin1}

  

# Opcionales, pero recomendados:
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none

# Habilitamos Flyway (si está en el classpath) y dejamos spring.sql.init en never para evitar doble ejecución
spring.flyway.enabled=true
spring.sql.init.mode=never

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


  

# Configuración del directorio de imágenes

  

#mysql://root:VWYGqvKCieeIFOPBdXeOgtAWLeWqHheJ@autorack.proxy.rlwy.net:30150/railway

storage.location=uploaded-images

  
  

# Configuración de Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Configuración de Email
# IMPORTANTE: Las credenciales están en variables de entorno (.env)
# NUNCA hardcodear credenciales en este archivo
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# URL base para el flujo de verificación (se concatena con el token)
app.verification.url=http://localhost:8080/verify?token=